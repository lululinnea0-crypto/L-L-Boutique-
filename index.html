<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L&L Boutique</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<header>

    <div class="logo">
        <img src="img/logo.png" alt="L&L Boutique">
    </div>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="#productos">Productos</a>
        <a href="#campania">Campaña</a>
        <a href="#como-comprar">Cómo comprar</a>
        <a href="#contacto">Contacto</a>
    </nav>

</header>
    
<section class="hero">

    <h1>L&L Boutique</h1>

    <p>Moda por encargo ✨</p>

    <button>Comprar Ahora</button>

</section>

    <section class="buscador">

    <input
        type="text"
        id="buscar"
        placeholder="🔍 Buscar productos..."
    >

    </section>

<section class="categorias">

<button>Todo</button>

<button>Cardigans</button>

<button>Pantalones</button>

<button>Vestidos</button>

<button>Remeras</button>

<button>Accesorios</button>

</section>
    
    <section class="campania">

    <h2>✨ Campaña Actual</h2>

    <div class="card-campania">

        <h3>Pedidos Abiertos</h3>

        <p>📅 Cierre de campaña: <strong>22 de julio</strong></p>

        <p>💳 Reserva con el 50% de seña.</p>

        <p>📦 Entrega estimada: 10 a 15 días.</p>

        <button>Reservar por WhatsApp</button>

    </div>

    </section>
    <section class="productos">

    <h2>Novedades ✨</h2>

    <div class="contenedor-productos" id="contenedor-productos">

    </div>

        <div class="producto">

            <img src="img/productos/cardigan.jpg" alt="Cardigan">

            <h3>Cardigan Largo</h3>

            <p class="precio">$39.990</p>

            <button>Reservar</button>

        </div>

        <div class="producto">

            <img src="img/productos/pantalon.jpg" alt="Pantalón">

            <h3>Pantalón Sastrero</h3>

            <p class="precio">$49.990</p>

            <button>Reservar</button>

        </div>

    </div>

    </section>
    
<script src="js/productos.js"></script>
<script src="js/script.js"></script>

</body>
</html>
